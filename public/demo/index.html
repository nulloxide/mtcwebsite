<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monachil Capital Partners — Investor Presentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #050a15;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Subtle gradient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% -20%, rgba(99, 102, 241, 0.12) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(99, 102, 241, 0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 2rem;
    }

    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(99, 102, 241, 0.15);
      border-radius: 16px;
      padding: 3rem 2.5rem;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 0 1px rgba(99, 102, 241, 0.05),
        0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .logo-wrapper {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-wrapper img {
      height: 56px;
      width: auto;
      opacity: 0.95;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.3), transparent);
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 500;
      color: #cbd5e1;
      text-align: center;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 0.8rem;
      font-weight: 300;
      color: #64748b;
      text-align: center;
      margin-bottom: 2rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .form-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 10px;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="password"]::placeholder {
      color: #475569;
    }

    input[type="password"]:focus {
      border-color: rgba(99, 102, 241, 0.5);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    input[type="password"].error {
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
      animation: shake 0.4s ease-in-out;
    }

    button {
      width: 100%;
      padding: 0.875rem;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.985);
    }

    .error-msg {
      text-align: center;
      color: #ef4444;
      font-size: 0.82rem;
      margin-top: 1rem;
      opacity: 0;
      transition: opacity 0.3s;
      height: 1.2rem;
    }

    .error-msg.visible {
      opacity: 1;
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.72rem;
      color: #334155;
      letter-spacing: 0.02em;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    /* Fade-in on load */
    .card {
      animation: fadeUp 0.5s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo-wrapper">
        <img src="presentation/MCP_Logo_TRANSPARENT.png" alt="Monachil Capital Partners">
      </div>
      <div class="divider"></div>
      <h1>Investor Presentation</h1>
      <p class="subtitle">Authorized Access Only</p>
      <form id="auth-form" autocomplete="off">
        <div class="form-group">
          <input
            type="password"
            id="password"
            placeholder="Enter access code"
            autocomplete="off"
            autofocus
          >
        </div>
        <button type="submit">Access Presentation</button>
        <div class="error-msg" id="error-msg">Invalid access code. Please try again.</div>
      </form>
      <div class="footer">&copy; 2026 Monachil Capital Partners. Confidential.</div>
    </div>
  </div>

  <script>
    // -----------------------------------------------------------------------
    // Password gate — SHA-256 hash comparison
    //
    // To set your own password, run in a terminal or browser console:
    //   echo -n "YOUR_PASSWORD" | shasum -a 256
    //   — or in JS —
    //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('YOUR_PASSWORD'))
    //     .then(b => Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join(''))
    //     .then(console.log)
    //
    // Then replace the VALID_HASH value below with your hash.
    // -----------------------------------------------------------------------
    const VALID_HASH = '8442adf411c981def4714dc51f791b38e9b0bff6a3546861b6b8e552051a0d1b';

    const form   = document.getElementById('auth-form');
    const input  = document.getElementById('password');
    const errMsg = document.getElementById('error-msg');

    // Already authenticated this session — go straight through
    if (sessionStorage.getItem('demo-auth') === 'true') {
      window.location.replace('presentation/investor_presentation.html');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw = input.value;
      if (!pw) return;

      const hashBuffer = await crypto.subtle.digest(
        'SHA-256',
        new TextEncoder().encode(pw)
      );
      const hashHex = Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');

      if (hashHex === VALID_HASH) {
        sessionStorage.setItem('demo-auth', 'true');
        window.location.replace('presentation/investor_presentation.html');
      } else {
        input.classList.add('error');
        errMsg.classList.add('visible');
        setTimeout(() => {
          input.classList.remove('error');
        }, 500);
        setTimeout(() => {
          errMsg.classList.remove('visible');
        }, 3000);
      }
    });
  </script>
</body>
</html>
