<title>CLS Platform — Data Pipeline Architecture</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

/* ── Theme Variables ── */
:root,[data-theme="dark"]{
  --bg:#060a14;--text:#e2e8f0;--text-muted:#64748b;--text-sub:#475569;
  --grid:rgba(100,200,255,0.01);
  --blob1:rgba(205,127,50,0.05);--blob2:rgba(148,163,184,0.03);--blob3:rgba(139,92,246,0.03);--blob4:rgba(255,215,0,0.04);
  --tip-bg:rgba(6,10,20,0.96);--tip-border:rgba(255,255,255,0.1);--tip-text:#cbd5e1;--tip-shadow:rgba(0,0,0,0.6);
  --btn-bg:rgba(100,160,255,0.08);--btn-border:rgba(100,160,255,0.2);--btn-text:#94a3b8;
  --title-grad:linear-gradient(135deg,#60a5fa,#a78bfa,#2dd4bf);
  --badge-bz-c:#cd7f32;--badge-bz-bg:rgba(205,127,50,0.1);--badge-bz-bdr:rgba(205,127,50,0.2);
  --badge-sv-c:#a8a8c0;--badge-sv-bg:rgba(168,168,192,0.08);--badge-sv-bdr:rgba(168,168,192,0.15);
  --badge-gd-c:#ffd700;--badge-gd-bg:rgba(255,215,0,0.08);--badge-gd-bdr:rgba(255,215,0,0.15);
}
[data-theme="light"]{
  --bg:#f1f5f9;--text:#0f172a;--text-muted:#475569;--text-sub:#64748b;
  --grid:rgba(15,23,42,0.03);
  --blob1:rgba(205,127,50,0.04);--blob2:rgba(148,163,184,0.025);--blob3:rgba(139,92,246,0.025);--blob4:rgba(255,215,0,0.035);
  --tip-bg:rgba(248,250,252,0.97);--tip-border:rgba(15,23,42,0.12);--tip-text:#334155;--tip-shadow:rgba(0,0,0,0.12);
  --btn-bg:rgba(30,41,59,0.05);--btn-border:rgba(30,41,59,0.15);--btn-text:#475569;
  --title-grad:linear-gradient(135deg,#1d4ed8,#6d28d9,#0d9488);
  --badge-bz-c:#92400e;--badge-bz-bg:rgba(205,127,50,0.08);--badge-bz-bdr:rgba(180,100,30,0.25);
  --badge-sv-c:#475569;--badge-sv-bg:rgba(100,116,139,0.08);--badge-sv-bdr:rgba(100,116,139,0.2);
  --badge-gd-c:#a16207;--badge-gd-bg:rgba(161,98,7,0.08);--badge-gd-bdr:rgba(161,98,7,0.2);
}

body{
  font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);
  overflow-x:hidden;min-height:100vh;transition:background 0.3s ease,color 0.3s ease;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 8% 40%,var(--blob1) 0%,transparent 45%),
    radial-gradient(ellipse at 35% 35%,var(--blob2) 0%,transparent 40%),
    radial-gradient(ellipse at 62% 35%,var(--blob3) 0%,transparent 40%),
    radial-gradient(ellipse at 88% 40%,var(--blob4) 0%,transparent 45%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:60px 60px;
}
.page{position:relative;z-index:1;padding:12px 14px 30px;min-width:900px;max-width:2200px;margin:0 auto}

/* Header */
.hdr{text-align:center;margin-bottom:10px;position:relative}
.hdr h1{
  font-size:1.7rem;font-weight:900;letter-spacing:-0.5px;
  background:var(--title-grad);background-size:200% 200%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shimmer 4s ease-in-out infinite;
}
.hdr .sub{color:var(--text-sub);font-size:0.7rem;margin-top:4px;letter-spacing:0.5px}
.hdr .sub span{
  display:inline-block;padding:2px 10px;border-radius:10px;margin:0 3px;font-weight:600;
}
.hdr .sub .bz{color:var(--badge-bz-c);background:var(--badge-bz-bg);border:1px solid var(--badge-bz-bdr)}
.hdr .sub .sv{color:var(--badge-sv-c);background:var(--badge-sv-bg);border:1px solid var(--badge-sv-bdr)}
.hdr .sub .gd{color:var(--badge-gd-c);background:var(--badge-gd-bg);border:1px solid var(--badge-gd-bdr)}
@keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

/* Theme toggle */
.theme-toggle{
  position:absolute;top:0;right:0;background:var(--btn-bg);border:1px solid var(--btn-border);
  border-radius:8px;color:var(--btn-text);font-size:0.65rem;font-family:'Inter',sans-serif;
  padding:4px 12px;cursor:pointer;transition:border-color 0.2s ease;
  display:flex;align-items:center;gap:5px;
}
.theme-toggle:hover{border-color:var(--text-muted)}
.theme-toggle .icon{font-size:0.85rem}

/* Legend row */
.legend{display:flex;justify-content:center;gap:28px;margin:10px 0 8px;flex-wrap:wrap}
.legend .it{display:flex;align-items:center;gap:6px;font-size:0.62rem;color:var(--text-muted)}
.legend .dt{width:8px;height:8px;border-radius:2px}

svg.main{width:100%;display:block}
text{font-family:'Inter',sans-serif}

/* Animations */
@keyframes flowDash{to{stroke-dashoffset:-40}}

/* Hover */
svg.main .stage{cursor:pointer}
svg.main .stage .card{transition:filter 0.3s ease,stroke-width 0.3s ease}
svg.main .stage:hover .card{stroke-width:2.2}

/* Tooltip */
.tip{
  position:fixed;z-index:9999;pointer-events:none;
  background:var(--tip-bg);border:1px solid var(--tip-border);
  border-radius:10px;padding:12px 16px;max-width:260px;
  font-size:0.68rem;color:var(--tip-text);line-height:1.5;
  backdrop-filter:blur(14px);box-shadow:0 12px 40px var(--tip-shadow);
  opacity:0;transition:opacity 0.15s ease;
}
.tip.show{opacity:1}
.tip h4{font-size:0.78rem;font-weight:700;margin-bottom:4px}
.tip .bg{display:inline-block;padding:1px 7px;border-radius:4px;font-size:0.58rem;font-weight:700;letter-spacing:0.5px;margin-bottom:6px}

/* Stage entrance animation — opacity only (CSS transform would override SVG transform attributes) */
@keyframes stageFadeIn{from{opacity:0}to{opacity:1}}
svg.main .stage{opacity:0}
svg.main .stage.entered{animation:stageFadeIn 0.5s ease forwards;opacity:1}

/* Hover flow dimming — gentle and smooth */
svg.main .stage{transition:opacity 0.5s ease, filter 0.5s ease}
svg.main .flow-arrow{transition:opacity 0.5s ease}
svg.main.highlighting .stage{opacity:0.4!important;filter:saturate(0.3);transition:opacity 0.5s ease, filter 0.5s ease}
svg.main.highlighting .flow-arrow{opacity:0.15!important;transition:opacity 0.5s ease}
svg.main.highlighting .stage.active{opacity:1!important;filter:saturate(1) brightness(1.05);transition:opacity 0.5s ease, filter 0.5s ease}

/* Breadcrumb */
.breadcrumb{display:flex;justify-content:center;gap:4px;margin:6px 0 4px;flex-wrap:wrap;align-items:center}
.breadcrumb .step{

}
.breadcrumb .step:hover{border-color:var(--text-muted);color:var(--text)}
.breadcrumb .step.hl{color:var(--text);border-color:var(--text-muted)}

/* Click-to-expand modal */
.modal-overlay{
  position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,0.7);
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(6px);animation:modalFadeIn 0.2s ease;
}
.modal-overlay.show{display:flex}
@keyframes modalFadeIn{from{opacity:0}to{opacity:1}}

  padding:24px 28px;max-width:420px;width:90%;max-height:85vh;overflow-y:auto;

}
@keyframes modalSlideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-card h3{font-size:1rem;font-weight:800;margin-bottom:8px}
.modal-card .mbadge{display:inline-block;padding:2px 10px;border-radius:6px;font-size:0.6rem;font-weight:700;letter-spacing:0.5px;margin-bottom:10px}

.modal-card .close-btn{
  position:absolute;top:12px;right:16px;background:none;border:none;

}

  document.getElementById('theme-icon').innerHTML=isDark?'&#9728;':'&#9790;';
  document.getElementById('theme-label').textContent=isDark?'Dark':'Light';
  try{localStorage.setItem('cls-theme',next)}catch(e){}
}

    const d=tips[g.getAttribute('data-tip')];if(!d)return;
    el.innerHTML='<h4>'+d.t+'</h4><span class="bg" style="color:'+d.c+';background:'+d.b+'">'+d.bg+'</span><p>'+d.d+'</p>';
    el.classList.add('show');vis=true;
  });
  g.addEventListener('mouseleave',()=>{el.classList.remove('show');vis=false;});
});
document.addEventListener('mousemove',e=>{
  if(!vis)return;
  const x=e.clientX+14,y=e.clientY+14,w=el.offsetWidth,h=el.offsetHeight;
  el.style.left=(x+w>innerWidth?e.clientX-w-10:x)+'px';
  el.style.top=(y+h>innerHeight?e.clientY-h-10:y)+'px';
});

    html+='<span class="mbadge" style="color:'+d.c+';background:'+d.b+';border:1px solid '+d.c+'">'+d.bg+'</span>';
    html+='<p>'+d.d+'</p>';
    if(d.detail){
      html+='<dl class="mdetail">';
      for(const[k,v] of Object.entries(d.detail)){
        html+='<dt>'+k+'</dt><dd>'+v+'</dd>';
      }
      html+='</dl>';
    }
    mcard.innerHTML=html;
    modal.classList.add('show');
    el.classList.remove('show');vis=false;
  });
});
modal.addEventListener('click',e=>{

// ── Hover flow highlighting (debounced for smooth feel) ──
const svg=document.querySelector('svg.main');

const flowMap={

  silver:['bz-sv-flow','sv-en-flow'],

  gold:['en-gd-flow','gd-co-flow'],
  consumption:['gd-co-flow']
};
let hoverTimer=null;
stages.forEach(s=>{
  s.addEventListener('mouseenter',()=>{
    clearTimeout(hoverTimer);
    const key=s.getAttribute('data-tip');
    const flows=flowMap[key]||[];
    svg.querySelectorAll('.active').forEach(e=>e.classList.remove('active'));
    svg.classList.add('highlighting');
    s.classList.add('active');
    flows.forEach(id=>{
      const el=svg.querySelector('#'+id);
      if(el)el.classList.add('active');
    });
  });
  s.addEventListener('mouseleave',()=>{
    hoverTimer=setTimeout(()=>{
      svg.classList.remove('highlighting');
      svg.querySelectorAll('.active').forEach(e=>e.classList.remove('active'));
    },150);
  });
});

  btn.addEventListener('click',()=>{
    const key=btn.getAttribute('data-stage');
    const x=stagePositions[key];if(x===undefined)return;
    // Highlight breadcrumb
    document.querySelectorAll('.breadcrumb .step').forEach(b=>b.classList.remove('hl'));
    btn.classList.add('hl');
    // Flash the stage
    const stage=svg.querySelector('.stage[data-tip="'+key+'"]')||svg.querySelector('g[data-tip="'+key+'"]');
    if(stage){
      stage.style.transition='filter 0.3s ease';
      stage.style.filter='brightness(1.4) drop-shadow(0 0 8px rgba(255,255,255,0.3))';
      setTimeout(()=>{stage.style.filter='';},1200);
      // Scroll SVG into view
      stage.scrollIntoView({behavior:'smooth',block:'center',inline:'center'});
    }
  });
});
</script>
</body>
</html>
